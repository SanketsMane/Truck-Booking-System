<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="ShareTruck — find or share spare truck capacity on routes across India. Verified transporters, live tracking, and secure in-app payments." />
    <link rel="canonical" href="https://sharetruck.visionitinfra.com/" />

    <!-- Open Graph / Twitter Card — static defaults, since several social
         scrapers don't execute JS and only ever see this file. Individual
         pages layer more specific title/description on top at runtime for
         JS-executing crawlers — see frontend/src/hooks/usePageMeta.js. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ShareTruck" />
    <meta property="og:title" content="ShareTruck — India's truck capacity marketplace" />
    <meta property="og:description" content="Find or share spare truck capacity on routes across India. Verified transporters, live tracking, and secure in-app payments." />
    <meta property="og:url" content="https://sharetruck.visionitinfra.com/" />
    <meta property="og:image" content="https://sharetruck.visionitinfra.com/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ShareTruck — India's truck capacity marketplace" />
    <meta name="twitter:description" content="Find or share spare truck capacity on routes across India. Verified transporters, live tracking, and secure in-app payments." />
    <meta name="twitter:image" content="https://sharetruck.visionitinfra.com/icons/icon-512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>ShareTruck</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
