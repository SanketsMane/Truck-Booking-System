# ShareTruck server blocks, meant to be APPENDED to the shared front-door
# nginx config on the host (/opt/mbfx/apps/web/nginx.conf as of this
# writing, mounted read-only into the mbfx-web-1 container), not installed
# as a standalone file. That one file already fronts several unrelated
# projects (mbfx, echosoul, abct), each as its own server block — this
# follows that exact convention. See Docs/DEPLOYMENT_VISIONITINFRA.md for
# the full step-by-step (backup, reload, certbot webroot, etc.).
#
# Stage 1 — HTTP only, just enough to pass the certbot webroot challenge.
# Add this block, reload nginx, obtain the cert, THEN add Stage 2 below.

# ===== ShareTruck (sharetruck.visionitinfra.com) — added by deployment, =====
# ===== HTTP-only until the Let's Encrypt cert is issued; see the HTTPS  =====
# ===== block added later                                                =====
server {
    listen 80;
    listen [::]:80;
    server_name sharetruck.visionitinfra.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://sharetruck.visionitinfra.com$request_uri;
    }
}

# Stage 2 — full HTTPS block, added once the cert exists at
# /etc/letsencrypt/live/sharetruck.visionitinfra.com/. proxy_pass targets
# are container names, reachable once mbfx-web-1 is connected to the
# sharetruck_default Docker network (see docker-compose.prod.yml).

# ===== ShareTruck (sharetruck.visionitinfra.com) — HTTPS =====
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sharetruck.visionitinfra.com;

    ssl_certificate     /etc/letsencrypt/live/sharetruck.visionitinfra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sharetruck.visionitinfra.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Every top-level route prefix backend/app.js mounts. Several of these
    # names (verification, trucks, trips, bookings, notifications, support,
    # disputes, admin, wallet) are ALSO real frontend SPA page routes (see
    # frontend/src/routing/Routing.jsx) — e.g. /trucks is both a backend
    # prefix and the transporter's "my trucks" page. As long as the SPA is
    # already loaded, navigating between its own pages never issues a real
    # HTTP request here (React Router handles it client-side) — but a hard
    # refresh, a typed/bookmarked URL, or a web-push notification click
    # (sw.js's clients.openWindow) IS a real top-level navigation, and used
    # to land here, get proxied straight to Express, and either 404
    # ("Cannot GET /trucks" — no bare route at that path) or, for a prefix
    # that also happens to have a matching backend GET route (e.g.
    # /trips/:id), dump raw API JSON instead of the app shell. Both looked
    # like the app had crashed.
    #
    # A real browser navigation always sends Accept: text/html first; this
    # app's own fetch() calls (frontend/src/api/client.js) never do (a
    # fetch's default Accept is */*). So: hand real page loads to the
    # frontend unconditionally, regardless of prefix, and only send actual
    # API calls (from the SPA's own JS, or a server-to-server caller like a
    # webhook) to the backend. This fixes the whole class of collisions at
    # once instead of needing the prefix list to stay perfectly disjoint
    # from the frontend's route names forever.
    location ~ ^/(auth|files|verification|trucks|trips|bookings|chat|ratings|payment-logs|notifications|support|disputes|admin|wallet|webhooks|meta|push|health)(/|$) {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        if ($http_accept ~* "text/html") {
            proxy_pass http://sharetruck-frontend:80;
            break;
        }

        proxy_pass http://sharetruck-backend:3000;
    }

    location /socket.io/ {
        proxy_pass http://sharetruck-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://sharetruck-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 10m;
}
