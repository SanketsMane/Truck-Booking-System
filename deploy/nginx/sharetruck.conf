# Host-nginx server block for ShareTruck, on a shared server with other
# unrelated projects/sites. This is a self-contained file for ONE domain
# (sharetruck.visionitinfra.com) — it does not touch any other
# sites-available/sites-enabled config on the host.
#
# Install: copy this file to /etc/nginx/sites-available/sharetruck.conf on
# the server, then `ln -s` it into sites-enabled. Run `certbot --nginx -d
# sharetruck.visionitinfra.com` afterwards — certbot will rewrite this one
# file to add the HTTPS server block + HTTP->HTTPS redirect; it only
# touches server blocks matching this domain name.
#
# Route list below is exactly what backend/app.js mounts — frontend and
# backend share this one domain/origin (simplest for the httpOnly session
# cookie and Socket.IO's CORS check, both keyed off FRONTEND_URL).

server {
    listen 80;
    server_name sharetruck.visionitinfra.com;

    # Backend REST API — every top-level route prefix backend/app.js mounts.
    location ~ ^/(auth|files|verification|trucks|trips|bookings|chat|ratings|payment-logs|notifications|support|disputes|admin|wallet|webhooks|meta|push|health)(/|$) {
        proxy_pass http://127.0.0.1:4001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (chat, live location, notifications) — needs the Upgrade
    # headers for the websocket handshake.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else — the frontend static build (served by its own
    # container's nginx, which already does the SPA try_files fallback).
    location / {
        proxy_pass http://127.0.0.1:4080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
