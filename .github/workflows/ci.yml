name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check
      - name: Unit + integration tests
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Ephemeral MongoDB (single-node replica set — the wallet ledger's
      # transactions need one, see backend/scripts/ciMongoServer.js) rather
      # than a service container or the real Atlas cluster, so this job
      # has no external dependency and never touches shared/dev data.
      - name: Start ephemeral MongoDB
        working-directory: backend
        run: |
          MONGO_URI_FILE=/tmp/mongo-uri.txt nohup node scripts/ciMongoServer.js > /tmp/mongo.log 2>&1 &
          for i in $(seq 1 30); do
            [ -f /tmp/mongo-uri.txt ] && break
            sleep 1
          done
          echo "MONGODB_URL=$(cat /tmp/mongo-uri.txt)" >> "$GITHUB_ENV"

      - name: Start backend
        working-directory: backend
        env:
          NODE_ENV: development
          PORT: 3000
          SECRET_KEY: ci-only-secret-key-not-for-production-use
          FRONTEND_URL: http://localhost:5173
          MASTER_OTP: "123456"
        run: |
          nohup node server.js > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/health > /dev/null || (cat /tmp/backend.log && exit 1)

      - name: Seed admin user
        working-directory: backend
        env:
          NODE_ENV: development
        run: node scripts/seedAdmin.js

      - name: Build and preview frontend
        working-directory: frontend
        run: |
          npm run build
          nohup npm run preview -- --port 5173 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:5173 > /dev/null || (cat /tmp/frontend.log && exit 1)

      - name: Run Playwright E2E suite
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:3000
        run: npx playwright test

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: |
            /tmp/backend.log
            /tmp/frontend.log
            /tmp/mongo.log

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
