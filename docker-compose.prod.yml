# Production deployment on a shared host, alongside other unrelated
# projects (mbfx, echosoul, abct) that are already running there. No local
# MongoDB service here, unlike docker-compose.yml — this expects an
# external MongoDB (Atlas) via MONGODB_URL in backend/.env.production.
#
# No host ports are published at all — matches how the other projects on
# this host are already set up (e.g. echosoul-backend, echosoul-web). The
# shared front-door nginx container (mbfx-web-1) reaches these two
# services by container name over a Docker network, once connected to it:
#
#   docker network connect sharetruck_default mbfx-web-1
#
# Usage:
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
services:
  backend:
    build:
      context: ./backend
    container_name: sharetruck-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    volumes:
      - sharetruck-uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://sharetruck.visionitinfra.com
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN}
    container_name: sharetruck-frontend
    restart: unless-stopped

volumes:
  sharetruck-uploads:
